name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy -p wavesyncdb -p wavesyncdb_derive -p wavesync_relay -p wavesync-website -p wavesyncdb-bench -p wavesyncdb-e2e -- -D warnings
    - name: Build
      run: cargo build -p wavesyncdb -p wavesyncdb_derive -p wavesync_relay --verbose
    - name: Run unit tests
      run: cargo test -p wavesyncdb --lib -p wavesyncdb_derive -p wavesync_relay --verbose
    - name: Run integration tests
      run: cargo test -p wavesyncdb --test integration -- --test-threads=1
    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Check browser (wasm32) build
      run: cargo check -p wavesyncdb --features web --target wasm32-unknown-unknown
    - name: Run web sync-core and web/native convergence tests
      run: cargo test -p wavesyncdb --features web --test web_core --test web_native_convergence -- --test-threads=1
