name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy -p wavesyncdb -p wavesyncdb_derive -p wavesync_relay -p wavesync-website -p wavesyncdb-bench -p wavesyncdb-e2e -- -D warnings
    - name: Build
      run: cargo build -p wavesyncdb -p wavesyncdb_derive -p wavesync_relay --verbose
    - name: Run unit tests
      run: cargo test -p wavesyncdb --lib -p wavesyncdb_derive -p wavesync_relay --verbose
    - name: Run unit tests (push-sync)
      run: cargo test -p wavesyncdb --lib --features push-sync --verbose
    - name: Run integration tests
      run: cargo test -p wavesyncdb --test integration -- --test-threads=1
    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Check browser (wasm32) build
      run: cargo check -p wavesyncdb --features web --target wasm32-unknown-unknown
    - name: Run web sync-core and web/native convergence tests
      run: cargo test -p wavesyncdb --features web --test web_core --test web_native_convergence -- --test-threads=1

  wasm-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Run browser-store tests (headless Chrome)
      run: cd wavesyncdb && wasm-pack test --headless --chrome --features web --test wasm_store

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Add wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Build wasm page
      run: wasm-pack build tests-e2e/web/page --target web --dev
    - name: Build relay and native peer
      # Two invocations, not one `-p wavesync_relay -p wavesyncdb-e2e --bin
      # web_e2e_peer`: cargo's `--bin` filter restricts target selection to
      # that one binary name across ALL selected packages, so a combined
      # command silently builds only `web_e2e_peer` and skips `wavesync_relay`
      # entirely (no error, exit 0) since it has no target with that name.
      # Verified locally: the combined form leaves target/release/wavesync-relay
      # missing while reporting success.
      run: |
        cargo build -p wavesync_relay --release
        cargo build -p wavesyncdb-e2e --bin web_e2e_peer --release
    - name: Install puppeteer deps
      run: cd tests-e2e/web && npm ci
    - name: Run browser e2e
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      run: node tests-e2e/web/serve_and_test.mjs
