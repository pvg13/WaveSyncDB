# WaveSyncDB website — Docker Compose.
#
# Build context is website/ itself. The Dockerfile patches the workspace
# dependency to use wavesyncdb from crates.io.
#
# -- Local --
#   cd website && docker compose up --build
#   Then open http://localhost:8080.
#
# -- Dokploy --
#   Compose Path: website/docker-compose.yml
#   Base Directory: website

services:
  wavesync-website:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
