# WaveSyncDB website — Docker Compose.
#
# Build context is the website/ directory itself. The Dockerfile patches
# the workspace dependency to use wavesyncdb from crates.io so no sibling
# crates are needed in the context.
#
# -- Local testing --
#   cd website && docker compose up --build
#   Then open http://localhost:8080.
#
# -- Deploy on Dokploy (type: Docker Compose) --
#   1. Source: this Git repo.
#   2. Compose Path: website/docker-compose.yml
#   3. Base Directory: website
#   4. No environment variables required.
#   5. Hit Redeploy on commits to `website/**`.
#
# -- Switching to a prebuilt image --
#   Replace the `build:` block with `image: ghcr.io/pvg13/wavesync-website:latest`
#   once a CI workflow publishes the image.

services:
  wavesync-website:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEBSITE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
