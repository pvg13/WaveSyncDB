# Phase A — setup + sentinel. See test.sh for the full sequence.
#
# Launched WITHOUT clearState: test.sh already did `pm clear` plus a
# config-bootstrap boot before this flow. That first boot exists because
# a freshly-cleared app cannot initialize Firebase — the Kotlin side's
# ensureFirebaseFromConfig needs `.wavesync_config.json`, which is only
# written by `build()` during that same first boot. This (second) boot
# therefore starts with the config present: Firebase initializes, the
# FCM token is fetched and written, and the engine registers it with
# the relay mid-run. test.sh then waits for the relay to confirm the
# registration before killing the app (HOME + `am kill` via adb — a
# Maestro killApp was observed being followed by a spurious app
# relaunch from Maestro's own on-device driver) — a phone killed
# without a registered token can never be woken, which made the old
# single-boot flow silently untestable.
#
# Selectors:
#   - The AddTaskForm input is tapped by position: current WebView
#     versions do not expose an <input>'s placeholder text ("What
#     needs to be done?") in the accessibility tree. The input sits at
#     a stable position in this fixed layout: left of "Add", ~38% down.
#   - "Add" is the submit button on the same form.

appId: com.wavesync.mobile_demo
---
- launchApp:
    clearState: false

# Wait for the app's WebView to render. h1 in src/main.rs is
# "WaveSyncDB Mobile Demo".
- extendedWaitUntil:
    visible: "WaveSyncDB Mobile Demo"
    timeout: 60000

# Sentinel task: proves the app itself can write while running and
# the relay path delivers it to the writer-peer. The literal title
# is provided via WAVESYNC_FCM_PHONE_SENTINEL — test.sh sets a
# UUID-suffixed value per run so prior-run residue can't make the
# assertion trivially pass.
- tapOn:
    point: "42%,38%"
- inputText: ${WAVESYNC_FCM_PHONE_SENTINEL ?? 'from-phone-A'}
- tapOn: "Add"
- extendedWaitUntil:
    visible: ${WAVESYNC_FCM_PHONE_SENTINEL ?? 'from-phone-A'}
    timeout: 15000

# No killApp here — test.sh first waits for the relay to log this
# phone's FCM token registration, then kills via adb (see test.sh).
