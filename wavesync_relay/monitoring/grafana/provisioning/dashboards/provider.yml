apiVersion: 1

providers:
  - name: wavesync
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      # Outside /var/lib/grafana: that path is masked by the grafana-data
      # volume after first deploy (named volumes seed from the image only
      # when empty), which would silently freeze baked dashboards.
      path: /etc/grafana/dashboards
