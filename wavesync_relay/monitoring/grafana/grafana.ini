# Baked into the image (orchestrator-proof; see the monitoring section of
# docker-compose.yml). Secrets never live here — the admin password comes
# from GF_SECURITY_ADMIN_PASSWORD at runtime.
[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[metrics]
# Grafana's own /metrics would otherwise be served unauthenticated through
# the public domain; nothing scrapes Grafana itself in this stack.
enabled = false
