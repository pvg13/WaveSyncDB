# WaveSyncDB relay — Dokploy-ready Docker Compose with file-mounted secrets.
#
# -- Deploy on Dokploy (type: Docker Compose) --
#   1. Source: this Git repo.
#   2. Compose Path: wavesync_relay/docker-compose.yml
#   3. Base Directory (build context): wavesync_relay
#
#   4. Secrets — Dokploy's UI for COMPOSE-type services cannot mount a file
#      to an arbitrary container path (File Mounts always land under the
#      project's files/ directory on the host; the "mount path" field is
#      relative to that directory, not the container). Two working options:
#
#      a) FILE MOUNT + compose bind (ACTIVE in this file for FCM + APNs):
#         in Dokploy create File Mounts named exactly `fcm.json` (service-
#         account JSON) and `apns.p8` (APNs PEM). They land at
#         <project>/files/<name> on the host; the volumes: section below
#         already binds them into /run/secrets/, which the content env vars
#         default to. Skip the ones you don't use — but then also comment
#         out the matching bind line below (see the warning there).
#
#      b) INLINE ENV alternative: paste the secret CONTENT into the env var
#         in Dokploy's Environment tab; the relay auto-detects content vs
#         path (env overrides the mounted-path default):
#           FCM_CREDENTIALS  = service-account JSON minified to ONE line
#                              (jq -c . fcm.json) — detected by leading `{`
#           IDENTITY_KEYPAIR = base64 keypair string (only to migrate an
#                              existing PeerId; a fresh deploy generates one
#                              and persists it in the relay-data volume)
#           APNS_KEY_FILE    = inline PEM (detected by -----BEGIN). PEMs are
#                              multiline and .env-style editors often mangle
#                              them — the file mount (a) is safer for APNs.
#
#   5. Environment Variables — set at minimum:
#          EXTERNAL_ADDRESS   (REQUIRED — public multiaddr clients dial)
#          MAILBOX_DB=/data/mailbox.db   (enables the durable store-and-
#                                         forward mailbox; off when unset)
#      Plus the APNs metadata (KEY_ID / TEAM_ID / BUNDLE_ID) if you use APNs.
#
#   6. Ports — there is nothing to configure in the Dokploy UI (Compose
#      services have no Ports tab by design): the relay's 4001/tcp+udp are
#      published directly on the host by the `mode: host` entries below, and
#      Grafana is reached through a Domain (Traefik), never a published
#      port. Just open 4001/tcp+udp in the server firewall.
#
#   7. Hit Redeploy (not Restart) so the container picks up new mounts/env.
#
# -- Monitoring (Prometheus + Grafana) --
#   Runs as TWO SEPARATE Dokploy services (stock images, fully configured in
#   the Dokploy UI: env, file mounts to real container paths, domain), NOT
#   inside this compose file — Dokploy's Compose type doesn't allow UI-side
#   port/mount/compose edits, which made the bundled variant unmanageable.
#   Step-by-step setup: monitoring/README.md.
#
#   This service only provides the scrape endpoint: METRICS_ADDR below binds
#   0.0.0.0:9464 INSIDE the container (never published on the host), and
#   `container_name: wavesync-relay` pins the DNS name so the external
#   Prometheus service can scrape wavesync-relay:9464 across the shared
#   dokploy-network.
#
#   Local preview of the full stack (relay + provisioned dashboard):
#     docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# -- Local testing --
#   Place your secrets under ./secrets/ next to this file and run:
#     docker compose up --build
#
# -- Switching to the prebuilt image --
#   Replace the `build:` block with `image: ghcr.io/pvg13/wavesync-relay:latest`.

services:
  wavesync-relay:
    build: .
    restart: unless-stopped
    # Stable DNS name on every attached network (incl. the shared
    # dokploy-network) so the separate Prometheus service can scrape
    # wavesync-relay:9464 regardless of Dokploy's compose project naming.
    # Container names are host-unique — fine, there is one relay per host.
    container_name: wavesync-relay
    ports:
      # Long syntax with `mode: host` so dokploy/Swarm publishes these ports
      # directly on the node instead of through the ingress routing mesh.
      # Without `mode: host`, Swarm's mesh SNATs incoming connections (source
      # appears as the 10.0.0.0/24 ingress network), which makes libp2p
      # `identify` report a private IP back to clients; AutoNAT then asks the
      # relay to verify that unreachable address — wasted dials and log noise.
      # `network_mode: host` is NOT a workable alternative: Swarm services
      # don't support it, and dokploy's compose preprocessor injects a
      # `networks:` block that conflicts with it anyway.
      - target: 4001
        published: ${RELAY_TCP_PORT:-4001}
        protocol: tcp
        mode: host
      - target: 4001
        published: ${RELAY_UDP_PORT:-4001}
        protocol: udp
        mode: host
      # Uncomment to expose Prometheus metrics (expose to your Prometheus network only)
      # - target: 9464
      #   published: 9464
      #   protocol: tcp
      #   mode: host
    volumes:
      # Persists /data/identity.key (PeerId) and /data/push_tokens.db.
      - relay-data:/data

      # ACTIVE Dokploy File-Mount binds (header step 4b): create File Mounts
      # named exactly `fcm.json` and `apns.p8` in Dokploy (Advanced → Mounts;
      # they land at <project>/files/<name> on the host). Relative bind paths
      # resolve against this compose file's directory — the repo checkout
      # lives at <project>/code/, this file at code/wavesync_relay/, so
      # <project>/files is ../../files from here. If the relay logs a
      # missing-file / is-a-directory error for /run/secrets/*, the checkout
      # nesting differs — adjust the ../ depth.
      # If you don't use push notifications (or use inline env instead),
      # comment these two lines out; a bind whose host file doesn't exist
      # makes docker create an empty DIRECTORY at that path, which the relay
      # then treats as an unreadable credential (push stays disabled) and
      # which blocks creating the same-named File Mount later until removed.
      - ../../files/fcm.json:/run/secrets/fcm.json:ro
      - ../../files/apns.p8:/run/secrets/apns.p8:ro
      # Identity stays volume-persisted (relay-data); only mount it when
      # migrating an existing PeerId:
      # - ../../files/identity.b64:/run/secrets/identity.b64:ro
      #
      # Local testing variant (comment the ../../files lines above, use these,
      # place real files in ./secrets/):
      # - ./secrets/fcm.json:/run/secrets/fcm.json:ro
      # - ./secrets/apns.p8:/run/secrets/apns.p8:ro
      # - ./secrets/identity.b64:/run/secrets/identity.b64:ro
    environment:
      # ---------- REQUIRED ----------
      # Public multiaddr advertised to clients. Without it, clients get
      # NoAddressesInReservation and WAN sync is broken.
      # Examples: /ip4/203.0.113.10/tcp/4001  or  /dns4/relay.example.com/tcp/4001
      EXTERNAL_ADDRESS: "${EXTERNAL_ADDRESS}"

      # ---------- Secret content paths or inline values ----------
      # Each accepts EITHER a filesystem path OR the inline content. The relay
      # auto-detects: FCM/APNS values starting with `{` are treated as inline
      # JSON; APNs PEM starting with `-----BEGIN` is treated as inline PEM;
      # IDENTITY values matching the base64 character set are treated as
      # inline base64 keypair. Anything else is read as a file path.
      #
      # Defaults below point at the file-mount paths used when you configure
      # secrets via dokploy's Advanced → Mounts. To bypass file mounts, set
      # the env var in dokploy's Environment tab to the raw content instead;
      # that override wins because of the `${...:-default}` interpolation.
      IDENTITY_KEYPAIR: "${IDENTITY_KEYPAIR:-/run/secrets/identity.b64}"
      FCM_CREDENTIALS: "${FCM_CREDENTIALS:-/run/secrets/fcm.json}"
      APNS_KEY_FILE: "${APNS_KEY_FILE:-/run/secrets/apns.p8}"

      # ---------- APNs metadata (set via Dokploy env vars) ----------
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-}"
      APNS_SANDBOX: "${APNS_SANDBOX:-}"

      # ---------- Push notification store ----------
      PUSH_DB: /data/push_tokens.db
      # PUSH_DEBOUNCE_SECS: 2

      # ---------- Tuning (optional) ----------
      # LISTEN_ADDR: /ip4/0.0.0.0/tcp/4001
      # MAX_CIRCUITS: 256
      # MAX_CIRCUIT_DURATION_SECS: 3600
      # MAX_CIRCUIT_BYTES: 0
      # IDLE_CONNECTION_TIMEOUT_SECS: 300

      # ---------- Observability ----------
      # Prometheus metrics listener (default loopback; expose to your Prometheus network only)
      METRICS_ADDR: "0.0.0.0:9464"

      # ---------- Logging ----------
      RUST_LOG: "${RUST_LOG:-info}"

volumes:
  relay-data:
